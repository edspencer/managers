name: Managers CI

on:
  push:
    branches: [main]
  # `chore/**` / `feat/**` cover stacked PRs whose BASE is an integration or
  # feature branch; without them such PRs would land with no typecheck, tests
  # or E2E at all.
  pull_request:
    branches: [main, "chore/**", "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Unit/Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Runs before `npm ci` — it needs no dependencies and is near-instant, so a
      # NUL byte fails the build immediately. A raw 0x00 in a source file is
      # invisible in diffs and makes ripgrep/grep skip the whole file as binary,
      # so nothing else in review or CI would ever notice it. See issue #570.
      - name: Guard — no raw NUL bytes in JS/TS sources
        run: npm run check:nul
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Server (unit + integration, incl. the real FleetManager + fake-claude
      # harness) and web (component + transport) — all with zero Anthropic calls.
      - name: Unit + integration tests
        run: npm test

  # The CLI contract, checked from the outside by @edspencer/cli-conformance: `--version` is
  # bare, `--help` exits 0, an unknown flag exits 2 with the usage after the message,
  # `service status` exits 4 with nothing installed and its --json matches the shared schema,
  # `busy` exits 3 with nothing running and its --json matches the schema too, `serve`'s first
  # stdout line is `Managers <version>: <url>`, and /api/health answers with that same version.
  # `cli-contract.json` at the root says which checks apply; since wave C1 every one of the
  # nine does, with no skips — and a NEWER runner's new check fails until this repo says
  # whether IT applies, which is the point.
  #
  # `--dir dist-npm`, not the repo root: Managers' publishable package is SYNTHESIZED from two
  # private workspaces by scripts/make-npm-package.mjs (see RELEASING.md), so `npm pack` at the
  # root would pack the private root manifest, which has no `bin` at all. `npm run pack:npm`
  # stages the real thing and the runner packs that — the same tarball a user installs.
  #
  # This is the check that found the banner bug: with pino on stdout, a machine with no Claude
  # login printed a JSON log line as `serve`'s first line. Nothing else in CI could see it.
  conformance:
    name: CLI conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stage the npm package
        run: npm run pack:npm
      - name: Conformance
        run: npx cli-conformance --dir dist-npm --config cli-contract.json

  # `managers service …` against the REAL service manager: launchd's gui/<uid> domain on the
  # macOS runner, systemd's user instance on the Ubuntu runner (with lingering on, so there
  # is one). scripts/service-real.mjs stages and packs the npm package, installs it into a
  # temporary prefix, then installs, kills, stops, starts, restarts and uninstalls the
  # service, checking the exit codes and that the log file really receives the server's
  # stdout. It writes the runner's real LaunchAgents / systemd user directory under the real
  # label, which is why it runs only here and refuses without MANAGERS_REAL_SERVICE=1.
  #
  # This is the only place the service CAN be proven: the dev box is a container with tini
  # as PID 1 — no systemd, not a Mac — so everything else about these units is covered by
  # unit tests of the rendered file, which cannot catch a key launchd rejects or a
  # `systemctl --user` that will not load what we wrote.
  service:
    name: Service (real ${{ matrix.os == 'macos-latest' && 'launchd' || 'systemd' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A `systemctl --user` needs a user manager, and a GitHub runner has none until
      # lingering starts one. Without this every systemctl call fails on the bus address.
      - name: Start a systemd user instance (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: The service lifecycle, for real
        env:
          MANAGERS_REAL_SERVICE: "1"
        run: node scripts/service-real.mjs

  # Fails on a high/critical npm advisory that is not a documented exception
  # (docs/security/npm-audit.md). Reads only the lockfile, so no `npm ci`.
  audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run audit:check

  e2e:
    name: E2E (Playwright, fake-claude)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web + server
        run: npm run build
      # Drives the built SPA against the real server + fake-claude binary across
      # a standard + a git-enabled Playwright server (no Anthropic calls).
      # MANAGERS_E2E_TMP/_GIT_TMP pin the run's temp dirs. Left unset the
      # config mkdtemps under os.tmpdir(), and the upload step below could not
      # name the HTML report + traces.
      - name: Browser E2E journeys
        id: e2e
        env:
          MANAGERS_E2E_TMP: ${{ runner.temp }}/managers-e2e
          MANAGERS_E2E_GIT_TMP: ${{ runner.temp }}/managers-e2e-git
        run: npm run test:e2e
      # Only when the E2E step itself failed: an earlier step failing (npm ci,
      # build) would leave nothing to upload, and `if-no-files-found: error` is
      # the point — a future path breakage must be LOUD, not a silent no-op.
      - name: Upload Playwright report on failure
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # report/ is the HTML reporter's outputFolder; test-results/ is
          # `outputDir` — the failure screenshots, traces and videos.
          path: |
            ${{ runner.temp }}/managers-e2e/report/
            ${{ runner.temp }}/managers-e2e/test-results/
          retention-days: 7
          if-no-files-found: error
