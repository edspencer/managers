name: Managers CI

on:
  push:
    branches: [main]
  # `chore/**` / `feat/**` cover stacked PRs whose BASE is an integration or
  # feature branch; without them such PRs would land with no typecheck, tests
  # or E2E at all.
  pull_request:
    branches: [main, "chore/**", "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Unit/Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Runs before `npm ci` — it needs no dependencies and is near-instant, so a
      # NUL byte fails the build immediately. A raw 0x00 in a source file is
      # invisible in diffs and makes ripgrep/grep skip the whole file as binary,
      # so nothing else in review or CI would ever notice it. See issue #570.
      - name: Guard — no raw NUL bytes in JS/TS sources
        run: npm run check:nul
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Server (unit + integration, incl. the real FleetManager + fake-claude
      # harness) and web (component + transport) — all with zero Anthropic calls.
      - name: Unit + integration tests
        run: npm test

  e2e:
    name: E2E (Playwright, fake-claude)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web + server
        run: npm run build
      # Drives the built SPA against the real server + fake-claude binary across
      # a standard + a git-enabled Playwright server (no Anthropic calls).
      # MANAGERS_E2E_TMP/_GIT_TMP pin the run's temp dirs. Left unset the
      # config mkdtemps under os.tmpdir(), and the upload step below could not
      # name the HTML report + traces.
      - name: Browser E2E journeys
        id: e2e
        env:
          MANAGERS_E2E_TMP: ${{ runner.temp }}/managers-e2e
          MANAGERS_E2E_GIT_TMP: ${{ runner.temp }}/managers-e2e-git
        run: npm run test:e2e
      # Only when the E2E step itself failed: an earlier step failing (npm ci,
      # build) would leave nothing to upload, and `if-no-files-found: error` is
      # the point — a future path breakage must be LOUD, not a silent no-op.
      - name: Upload Playwright report on failure
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # report/ is the HTML reporter's outputFolder; test-results/ is
          # `outputDir` — the failure screenshots, traces and videos.
          path: |
            ${{ runner.temp }}/managers-e2e/report/
            ${{ runner.temp }}/managers-e2e/test-results/
          retention-days: 7
          if-no-files-found: error
